[workspace]
members = ["rust_core", "egui-app", "mcp-server"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true

# GP 学習（egobox の COBYLA 多点スタート・MoE の交差検証）は数値計算が重く、
# 未最適化だとテストが 10 倍以上遅くなる。依存クレート側だけ最適化することで
# 自クレート（ワークスペースメンバー）のデバッグ性と差分ビルド速度を保ったまま
# テストを高速化する（profile.dev は cargo test のデフォルトプロファイルにも
# 適用される。依存のコンパイル増加分は一度きりでキャッシュされる）。
[profile.dev.package."*"]
opt-level = 2

# CI 専用プロファイル。surrogate_opt のテストは自クレート側の数値計算
# （多点スタートの局所探索・交差検証ループ等）が opt-level=0 のままだと
# 重く、ローカルの差分ビルド速度を犠牲にせずに CI のテスト実行時間だけを
# 縮める（実測: opt-level=1 でテスト実行時間が約 1/14 に短縮）。
[profile.ci-test]
inherits = "dev"
opt-level = 1
