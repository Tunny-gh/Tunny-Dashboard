name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel superseded runs for the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # LightGBM native library version provisioned for build/test.
  # Bump together with libs/lib_lightgbm.def when upgrading LightGBM.
  LIGHTGBM_VERSION: v4.6.0

jobs:
  lint:
    name: Format & Clippy
    # clippy is check-only (no final link), so it runs on Linux without the
    # native LightGBM library.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting (rust_core)
        run: cargo fmt --manifest-path rust_core/Cargo.toml --all -- --check

      - name: Check Rust formatting (egui-app)
        run: cargo fmt --manifest-path egui-app/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        # RUSTSEC-2026-0194/0195 (quick-xml DoS via crafted XML) come from Linux-only
        # transitive deps of eframe 0.30: zbus_xml (accesskit AT-SPI backend) and
        # wayland-scanner. The app only ships Windows/macOS builds, and no compatible
        # update exists short of an eframe upgrade. Remove these ignores once eframe
        # pulls quick-xml >= 0.41.
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  build-test:
    name: Build & Test
    # The app links against a pre-built LightGBM native library and only
    # targets Windows/macOS (see CONTRIBUTING.md), so CI runs on those.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache LightGBM native library
        id: lgbm-cache
        uses: actions/cache@v6
        with:
          path: libs
          key: lgbm-v2-${{ matrix.os }}-${{ env.LIGHTGBM_VERSION }}-${{ hashFiles('libs/lib_lightgbm.def') }}

      # --- Windows: download the DLL and generate the MSVC import library ---
      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows' && steps.lgbm-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Provision LightGBM (Windows)
        if: runner.os == 'Windows' && steps.lgbm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force libs | Out-Null
          $url = "https://github.com/microsoft/LightGBM/releases/download/$env:LIGHTGBM_VERSION/lib_lightgbm.dll"
          Invoke-WebRequest -Uri $url -OutFile libs/lib_lightgbm.dll
          # Generate the import library from the tracked .def + downloaded DLL.
          lib /def:libs/lib_lightgbm.def /machine:x64 /out:libs/lib_lightgbm.lib

      # --- macOS: install via Homebrew (matches CONTRIBUTING.md) ---
      - name: Provision LightGBM (macOS)
        if: runner.os == 'macOS' && steps.lgbm-cache.outputs.cache-hit != 'true'
        run: |
          brew install lightgbm
          mkdir -p libs
          cp "$(brew --prefix lightgbm)/lib/lib_lightgbm.dylib" libs/
          # Bundle libomp next to it so the cached libs/ is fully self-contained:
          # on a cache hit this provision step is skipped (no brew install), so
          # the dylib must not depend on a Homebrew path that may be absent.
          cp "$(brew --prefix libomp)/lib/libomp.dylib" libs/
          chmod u+w libs/lib_lightgbm.dylib libs/libomp.dylib
          # build.rs looks lib_lightgbm up via @rpath; point its libomp
          # dependency at the sibling copy via @loader_path (mirrors CONTRIBUTING.md).
          install_name_tool -id "@rpath/lib_lightgbm.dylib" libs/lib_lightgbm.dylib
          install_name_tool -change \
            "@rpath/libomp.dylib" \
            "@loader_path/libomp.dylib" \
            libs/lib_lightgbm.dylib
          # install_name_tool invalidates the signature; the bottles are already
          # ad-hoc signed, so --force is required to re-sign.
          codesign --force -s - libs/libomp.dylib
          codesign --force -s - libs/lib_lightgbm.dylib

      # `cargo test` compiles every target (incl. the binary), so this both
      # verifies the build and runs the tests in a single debug pass — no
      # redundant cross-profile recompile of the heavy dependency graph.
      - name: Build & Test
        run: cargo test --workspace --locked
