name: Release

# Build a self-contained, ready-to-run package for each supported OS.
#
# Windows ships a zipped folder holding every file an end user needs. macOS
# ships a .app bundle inside a drag-to-install DMG; README.md and LICENSE are
# not bundled there, because the app already shows its own MIT license and every
# dependency license in its license modal.
#
# The app embeds third-party licenses, icon and fonts into the binary at build
# time (see egui-app/build.rs) and links to the online documentation site for
# help, so the only external runtime dependency that must travel with the
# executable is the pre-built LightGBM native library.
on:
  push:
    tags:
      - "v*"
  # Allow building a package on demand (e.g. to test the release pipeline).
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with ci.yml and libs/lib_lightgbm.def.
  LIGHTGBM_VERSION: v4.6.0

permissions:
  contents: write # required to create/update the GitHub Release
  actions: read # required by signpath/github-action-submit-signing-request to fetch the unsigned artifact

jobs:
  package:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The startup beta notice is suppressed per version, keyed on
      # CARGO_PKG_VERSION. Shipping a new tag without bumping egui-app/Cargo.toml
      # would leave the notice permanently hidden for anyone who dismissed the
      # previous release, so a mismatch fails the release instead.
      - name: Verify tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate_version=$(grep -m1 '^version = ' egui-app/Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF#refs/tags/}"
          if [ "v${crate_version}" != "${tag}" ]; then
            echo "::error::tag ${tag} does not match egui-app/Cargo.toml version ${crate_version}. Bump the crate version and re-tag."
            exit 1
          fi
          echo "tag ${tag} matches crate version ${crate_version}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      # --- Provision the LightGBM native library (mirrors ci.yml) ---
      - name: Cache LightGBM native library
        id: lgbm-cache
        uses: actions/cache@v6
        with:
          path: libs
          key: lgbm-v2-${{ matrix.os }}-${{ env.LIGHTGBM_VERSION }}-${{ hashFiles('libs/lib_lightgbm.def') }}

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows' && steps.lgbm-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Provision LightGBM (Windows)
        if: runner.os == 'Windows' && steps.lgbm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force libs | Out-Null
          $url = "https://github.com/microsoft/LightGBM/releases/download/$env:LIGHTGBM_VERSION/lib_lightgbm.dll"
          Invoke-WebRequest -Uri $url -OutFile libs/lib_lightgbm.dll
          lib /def:libs/lib_lightgbm.def /machine:x64 /out:libs/lib_lightgbm.lib

      - name: Provision LightGBM (macOS)
        if: runner.os == 'macOS' && steps.lgbm-cache.outputs.cache-hit != 'true'
        run: |
          brew install lightgbm
          mkdir -p libs
          cp "$(brew --prefix lightgbm)/lib/lib_lightgbm.dylib" libs/
          cp "$(brew --prefix libomp)/lib/libomp.dylib" libs/
          chmod u+w libs/lib_lightgbm.dylib libs/libomp.dylib
          install_name_tool -id "@rpath/lib_lightgbm.dylib" libs/lib_lightgbm.dylib
          install_name_tool -change \
            "@rpath/libomp.dylib" \
            "@loader_path/libomp.dylib" \
            libs/lib_lightgbm.dylib
          codesign --force -s - libs/libomp.dylib
          codesign --force -s - libs/lib_lightgbm.dylib

      - name: Build release binary
        run: cargo build --release --locked -p tunny-desktop

      # --- Assemble the distributable folder ---
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # --- Sign the Windows executable (SignPath Foundation OSS program) ---
      #
      # SignPath signs server-side: the private key never leaves SignPath's
      # infrastructure. The unsigned exe is uploaded as a throwaway GitHub
      # Actions artifact, signpath/github-action-submit-signing-request hands
      # it to SignPath and downloads the signed copy back, and that copy
      # replaces the unsigned one before packaging.
      #
      # Only runs for tag pushes on the upstream repo: SIGNPATH_API_TOKEN and
      # SIGNPATH_ORGANIZATION_ID are repo secrets/variables that don't exist
      # on forks, and workflow_dispatch test builds don't need a signed
      # binary. See docs/handoff/2026-08-20_signpath-code-signing.md and
      # CONTRIBUTING.md#code-signing-windows for setup (SignPath project
      # creation, signing policy, required secrets/variables).
      - name: Upload unsigned executable (Windows)
        id: upload-unsigned-exe
        if: runner.os == 'Windows' && github.repository == 'Tunny-gh/Tunny-Dashboard' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: TunnyDashboard-unsigned-${{ steps.ver.outputs.version }}-${{ matrix.label }}
          path: target/release/TunnyDashboard.exe
          if-no-files-found: error

      - name: Sign executable (Windows)
        if: runner.os == 'Windows' && github.repository == 'Tunny-gh/Tunny-Dashboard' && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tunny-dashboard
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace executable with signed copy (Windows)
        if: runner.os == 'Windows' && github.repository == 'Tunny-gh/Tunny-Dashboard' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Copy-Item signed/TunnyDashboard.exe target/release/TunnyDashboard.exe -Force

      - name: Assemble package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PKG: TunnyDashboard-${{ steps.ver.outputs.version }}-${{ matrix.label }}
        run: |
          New-Item -ItemType Directory -Force $env:PKG | Out-Null
          Copy-Item target/release/TunnyDashboard.exe $env:PKG/
          # LightGBM DLL must sit next to the executable to be found at runtime.
          Copy-Item libs/lib_lightgbm.dll $env:PKG/
          Copy-Item README.md $env:PKG/
          Copy-Item LICENSE $env:PKG/
          Compress-Archive -Path $env:PKG -DestinationPath "$env:PKG.zip"
          echo "PKG=$env:PKG" >> $env:GITHUB_ENV
          echo "PKG_FILE=$env:PKG.zip" >> $env:GITHUB_ENV

      # --- macOS: build a .app bundle, then wrap it in a drag-install DMG ---
      #
      # The app is signed ad-hoc (`codesign -s -`), not with a Developer ID:
      # the project has no Apple Developer Program membership, so notarization
      # is not possible. Ad-hoc signing is still mandatory rather than optional
      # — arm64 refuses to execute an unsigned binary at all. Gatekeeper still
      # treats the result as an unidentified developer, so the release notes and
      # README carry the "Open Anyway" instructions users need.
      - name: Build app icon (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppIcon.iconset
          # The source icon is 512x512, so every slot up to 256x256@2x is a
          # downscale. 512x512@2x (1024px) is deliberately omitted rather than
          # upscaled — a blurry slot looks worse than letting macOS scale the
          # 512px one.
          for spec in 16:icon_16x16 32:icon_16x16@2x 32:icon_32x32 64:icon_32x32@2x \
                      128:icon_128x128 256:icon_128x128@2x 256:icon_256x256 \
                      512:icon_256x256@2x 512:icon_512x512; do
            size="${spec%%:*}"
            name="${spec#*:}"
            sips -z "$size" "$size" egui-app/assets/TunnyIcon.png \
              --out "AppIcon.iconset/${name}.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Assemble app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PKG: TunnyDashboard-${{ steps.ver.outputs.version }}-${{ matrix.label }}
        run: |
          set -euo pipefail
          APP="TunnyDashboard.app"
          # CFBundleShortVersionString must be a dotted numeric string, so it
          # reads the crate version rather than steps.ver.outputs.version, which
          # is a short commit SHA on workflow_dispatch runs. The tag and the
          # crate version are verified to agree earlier in this job.
          crate_version=$(grep -m1 '^version = ' egui-app/Cargo.toml | cut -d'"' -f2)

          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources"
          cp target/release/TunnyDashboard "$APP/Contents/MacOS/"
          # The binary loads @rpath/lib_lightgbm.dylib, and lib_lightgbm in turn
          # finds libomp via @loader_path (same folder), so both dylibs go to
          # Frameworks/ and the rpath points there.
          cp libs/lib_lightgbm.dylib libs/libomp.dylib "$APP/Contents/Frameworks/"
          cp AppIcon.icns "$APP/Contents/Resources/"

          # build.rs bakes in an absolute -rpath to the build-time libs/ dir,
          # which cannot exist on a user's machine. dyld would just skip it, but
          # drop it so `otool -l` output describes the shipped layout. rust_core
          # and egui-app each emit one, and -delete_rpath removes a single entry
          # per call, so try a bounded number of times and stop once it reports
          # that no such rpath is left.
          for _ in 1 2 3; do
            install_name_tool -delete_rpath "$PWD/libs" \
              "$APP/Contents/MacOS/TunnyDashboard" 2>/dev/null || break
          done
          install_name_tool -add_rpath @executable_path/../Frameworks \
            "$APP/Contents/MacOS/TunnyDashboard"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Tunny Dashboard</string>
            <key>CFBundleDisplayName</key>
            <string>Tunny Dashboard</string>
            <key>CFBundleExecutable</key>
            <string>TunnyDashboard</string>
            <key>CFBundleIdentifier</key>
            <string>com.hrntsm.tunny.dashboard</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleShortVersionString</key>
            <string>${crate_version}</string>
            <key>CFBundleVersion</key>
            <string>${crate_version}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSDocumentsFolderUsageDescription</key>
            <string>Tunny Dashboard needs access to open your Optuna study files (journal logs and SQLite databases).</string>
            <key>NSDesktopFolderUsageDescription</key>
            <string>Tunny Dashboard needs access to open your Optuna study files (journal logs and SQLite databases).</string>
            <key>NSDownloadsFolderUsageDescription</key>
            <string>Tunny Dashboard needs access to open your Optuna study files (journal logs and SQLite databases).</string>
          </dict>
          </plist>
          PLIST

          # install_name_tool invalidates signatures, so sign the dylibs first
          # and the bundle last — signing the bundle seals Info.plist and the
          # resources along with the executable.
          codesign --force --sign - "$APP/Contents/Frameworks/libomp.dylib"
          codesign --force --sign - "$APP/Contents/Frameworks/lib_lightgbm.dylib"
          codesign --force --sign - "$APP"

          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "PKG_FILE=$PKG.dmg" >> "$GITHUB_ENV"

      # A broken rpath or a stale signature still produces a DMG that builds
      # cleanly and only fails on the user's machine, so verify the bundle here.
      # `--version` prints and exits before any window is created, which makes it
      # runnable on a headless runner, and because lib_lightgbm is linked at load
      # time it forces dyld to resolve the whole dylib chain. On arm64 it also
      # proves the ad-hoc signature is valid, since a bad signature is fatal.
      - name: Verify app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="TunnyDashboard.app"
          crate_version=$(grep -m1 '^version = ' egui-app/Cargo.toml | cut -d'"' -f2)

          codesign --verify --strict --verbose=2 "$APP"
          otool -L "$APP/Contents/MacOS/TunnyDashboard"

          actual=$("$APP/Contents/MacOS/TunnyDashboard" --version)
          expected="TunnyDashboard ${crate_version}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::bundled binary reported '${actual}', expected '${expected}'"
            exit 1
          fi
          echo "smoke test passed: ${actual}"

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dmg-stage
          mkdir dmg-stage
          cp -R TunnyDashboard.app dmg-stage/
          # The /Applications alias is what makes the mounted window a
          # drag-to-install target.
          ln -s /Applications dmg-stage/Applications
          hdiutil create \
            -volname "Tunny Dashboard" \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "$PKG_FILE"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG_FILE }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    # Only attach assets to a Release when triggered by a version tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: dist

      # The macOS app is ad-hoc signed but not notarized (no Apple Developer
      # Program membership), so Gatekeeper blocks it on first launch. macOS 15
      # removed the old Control-click workaround, leaving System Settings as the
      # only route — without these instructions the app just reads as broken.
      # generate_release_notes appends the changelog below this body.
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.zip
            dist/**/*.dmg
          generate_release_notes: true
          body: |
            ## Installation

            ### macOS (Apple Silicon only)

            The `.dmg` is built for Apple Silicon (arm64). Intel Macs are not supported.

            1. Open the `.dmg` and drag **Tunny Dashboard** into your **Applications** folder.
            2. Launch it. macOS will report that the app cannot be opened because it
               is from an unidentified developer — this is expected, because the app
               is not notarized by Apple.
            3. Open **System Settings → Privacy & Security**, scroll to the bottom,
               and click **Open Anyway** next to the Tunny Dashboard message.
            4. Confirm once more when prompted. Subsequent launches open normally.

            ### Windows

            Extract the `.zip` and run `TunnyDashboard.exe`. Keep `lib_lightgbm.dll`
            in the same folder as the executable.

            See [CODE_SIGNING_POLICY.md](https://github.com/Tunny-gh/Tunny-Dashboard/blob/main/CODE_SIGNING_POLICY.md)
            for how release artifacts are signed on each platform.
