version: 2
updates:
  # Rust dependencies (workspace Cargo.toml + Cargo.lock)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Ignore major version bumps: they tend to break API compatibility and
    # fail CI. Security updates are unaffected by this ignore rule and still
    # surface as PRs.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
