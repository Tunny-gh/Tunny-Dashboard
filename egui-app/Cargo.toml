[package]
name = "tunny-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tunny-desktop"
path = "src/main.rs"

[dependencies]
tunny-core = { path = "../rust_core", default-features = false }
eframe = "0.30"
egui = "0.30"
egui_extras = "0.30"
egui_plot = "0.30"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
