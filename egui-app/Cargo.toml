[package]
name = "tunny-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "tunny_desktop"
path = "src/lib.rs"

[[bin]]
name = "TunnyDashboard"
path = "src/main.rs"

[dependencies]
tunny-core = { path = "../rust_core", default-features = false }
eframe = { version = "0.35", features = ["wgpu"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["image", "file", "svg"] }
egui_plot = "0.36"
egui-wgpu = "0.35"
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5"
rayon = "1"
arboard = "3"

[dev-dependencies]
tempfile = "3"
dhat = "0.3"

# メモリ計測サンプル（TASK-2343/2344）。dhat ヒーププロファイラを使い
# 列指向 StudyView と行指向 Vec<TrialRow> の常駐ヒープを比較する。
# 実行: cargo run --release --example mem_probe -- <journal.log>
[[example]]
name = "mem_probe"
path = "examples/mem_probe.rs"

[build-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
cargo_metadata = "0.18"

[target.'cfg(windows)'.build-dependencies]
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"
