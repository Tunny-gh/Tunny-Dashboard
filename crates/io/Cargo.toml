[package]
name = "tdashboard-io"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
test-support = []

[dependencies]
tdashboard-study = { path = "../study" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
postgres = "0.19"
mysql = { version = "28", default-features = false, features = ["minimal"] }

[dev-dependencies]
tempfile = "3"
