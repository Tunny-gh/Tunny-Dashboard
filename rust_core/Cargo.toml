[package]
name = "tunny-core"
version = "0.1.1"
edition = "2021"
description = "Core analytics library for Tunny Dashboard — journal parsing and DataFrame operations"
repository = "https://github.com/Tunny-gh/Tunny-Dashboard"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
tdashboard-analysis = { path = "../crates/analysis" }
tdashboard-io = { path = "../crates/io" }
tdashboard-study = { path = "../crates/study" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
arc-swap = "1"
quick-xml = "0.38"
ureq = { version = "2", default-features = false }
base64 = "0.22"
regex = "1"

[dev-dependencies]
faer = "0.24.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tdashboard-io = { path = "../crates/io", features = ["test-support"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "sensitivity_bench"
harness = false

[[bench]]
name = "sobol_bench"
harness = false

[[bench]]
name = "permutation_bench"
harness = false

[[bench]]
name = "journal_bench"
harness = false
