[package]
name = "tunny-core"
version = "0.1.0"
edition = "2021"
description = "Core analytics library for Tunny Dashboard — journal parsing and DataFrame operations"
repository = "https://github.com/Tunny-gh/Tunny-Dashboard"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
delaunator = "1.1"
faer = "0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
argmin = "0.11"
argmin-math = { version = "0.5", features = ["vec"] }
rand = "0.9"
rand_chacha = "0.9"
rand_xoshiro = "0.6"
egobox-gp = "0.36"
egobox-moe = "0.35"
linfa = "0.8"
linfa-clustering = "0.8"
ndarray = "0.16"
arc-swap = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
postgres = "0.19"
mysql = { version = "28", default-features = false, features = ["minimal"] }
quick-xml = "0.38"
ureq = { version = "2", default-features = false }
base64 = "0.22"
regex = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "sensitivity_bench"
harness = false

[[bench]]
name = "sobol_bench"
harness = false

[[bench]]
name = "permutation_bench"
harness = false

[[bench]]
name = "journal_bench"
harness = false
