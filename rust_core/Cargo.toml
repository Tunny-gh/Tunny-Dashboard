[package]
name = "tunny-core"
version = "0.1.0"
edition = "2021"
description = "Core analytics library for Tunny Dashboard — journal parsing and DataFrame operations"
repository = "https://github.com/Tunny-gh/Tunny-Dashboard"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
faer = "0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sampling_bench"
harness = false
