[package]
name = "tunny-mcp"
version = "0.1.1"
edition = "2021"
description = "MCP (Model Context Protocol) server exposing Tunny Dashboard's Optuna analytics headlessly"

[[bin]]
name = "tunny-mcp"
path = "src/main.rs"

[dependencies]
tunny-core = { path = "../rust_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
